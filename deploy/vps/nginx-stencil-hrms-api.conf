# /etc/nginx/sites-available/stencil-hrms-api (linked into sites-enabled) — as live on the VPS.
# hrms.stencilindia.com serves everything: /api and /health go to the HRMS server (PM2, port 5060), every other
# path is the website, fetched from Vercel. The certificate files come from `certbot --nginx -d hrms.stencilindia.com`
# (on a fresh server: run certbot once with only the port-80 block, then put this file in place).
server {
    listen 80;
    server_name hrms.stencilindia.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name hrms.stencilindia.com;

    ssl_certificate /etc/letsencrypt/live/hrms.stencilindia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hrms.stencilindia.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    # HRMS server (used by the website and the phone app)
    location /api/ {
        proxy_pass http://127.0.0.1:5060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:5060;
    }

    # Everything else: the HRMS website, fetched from Vercel (updates itself on every push)
    location / {
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        set $website https://hrms-pi-amber.vercel.app;
        proxy_pass $website;
        proxy_set_header Host hrms-pi-amber.vercel.app;
        proxy_ssl_server_name on;
        proxy_ssl_name hrms-pi-amber.vercel.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
