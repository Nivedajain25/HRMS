# Stencil HRMS — full stack: web (nginx) · api · worker · mongodb (replica set) · redis
#   cp .env.example .env   # fill in the JWT/encryption secrets
#   docker compose up -d --build
#   docker compose exec api node dist/seed.js   # optional demo data
# App: http://localhost:8080   API docs: enable ENABLE_SWAGGER=true → http://localhost:8080/api/docs

name: stencil-hrms

x-api-env: &api-env
  NODE_ENV: production
  PORT: 5000
  MONGODB_URI: mongodb://mongodb:27017/stencil_hrms?replicaSet=rs0
  REDIS_URL: redis://redis:6379
  CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
  API_URL: ${API_URL:-http://localhost:8080}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in .env}
  JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
  JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TRUST_PROXY: "true"
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:-Stencil HRMS <no-reply@example.com>}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
  STORAGE_LOCAL_DIR: /app/uploads
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  AWS_REGION: ${AWS_REGION:-}
  AWS_BUCKET: ${AWS_BUCKET:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  ENABLE_SWAGGER: ${ENABLE_SWAGGER:-false}

services:
  mongodb:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the single-node replica set on first start, then reports health.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      <<: *api-env
      RUN_WORKER: "false"
      ENABLE_JOBS: "false"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Consumes background jobs (emails, notifications, reminders) and runs the scheduler.
  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      <<: *api-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
  uploads:
