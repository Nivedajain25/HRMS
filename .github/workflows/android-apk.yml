name: Android APK

# Builds the installable APK entirely on GitHub's machines — no Expo account or EAS: the native Android project is
# generated from app.config.ts, then compiled with Gradle — and then installs it on an Android emulator to check the
# app opens without crashing. No secrets needed.
# Signing: Android's standard test (debug) key, the same on every run, so each new APK installs over the previous one
# (an APK from EAS uses a different key: uninstall that app once first). For internal testing, not the Play Store.
# Run it from GitHub → Actions → "Android APK" → Run workflow; it also runs when main changes the mobile app.
# Download: open the run → Artifacts → stencil-hrms-apk.
# In-app updates: once the emulator check passes, the APK is published as a GitHub release `android-v<run number>`
# (public link: https://github.com/Nivedajain25/HRMS/releases/latest/download/stencil-hrms.apk). The API notices it
# within ~10 minutes, pushes "Update available" to every phone on an older build, and the app offers to install it.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Baked into the app at build time: the live API (same as the EAS "preview" profile).
      EXPO_PUBLIC_API_URL: https://hrms-production-c889.up.railway.app
      # Every run is newer than the last, so the APK installs as an update.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      # The committed .npmrc pins the pnpm store to a local Windows path used on the primary dev workstation.
      - name: Drop workstation-specific pnpm config
        run: rm -f .npmrc

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: pnpm install --frozen-lockfile

      - name: Generate the native Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/app.config.ts') }}
          restore-keys: gradle-${{ runner.os }}-

      # Phones (arm64) and the test emulator (x86_64) only — skipping old 32-bit CPUs roughly halves the build.
      - name: Build the release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64

      - name: Name the APK
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk stencil-hrms.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stencil-hrms-apk
          path: stencil-hrms.apk
          retention-days: 14

  emulator:
    name: Install and open on an emulator
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: apps/mobile/scripts
      - uses: actions/download-artifact@v4
        with:
          name: stencil-hrms-apk

      # Hardware acceleration for the Android emulator on GitHub's Linux machines.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, open and check the app stays up
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash apps/mobile/scripts/emulator-smoke-test.sh stencil-hrms.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshot-and-log
          path: |
            emulator-screenshot.png
            logcat.txt
          retention-days: 14
          if-no-files-found: ignore

  release:
    name: Publish the update to phones
    runs-on: ubuntu-latest
    needs: [build, emulator]
    # Only builds of main reach users' phones.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: stencil-hrms-apk

      # The release's description is the "What's new" text in the app: the mobile-related commits since the last one.
      # (It can be edited afterwards on GitHub → Releases.)
      - name: Publish as a GitHub release (picked up by the in-app updater)
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
        run: |
          tag="android-v$BUILD"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already published"
            exit 0
          fi
          version=$(grep -oP "^\s*version: '\K[^']+" apps/mobile/app.config.ts | head -n 1)
          prev=$(git tag --list 'android-v*' --sort=-v:refname | head -n 1)
          notes=$(git log --no-merges --format='- %s' ${prev:+$prev..}HEAD -- apps/mobile packages | head -n 15)
          [ -n "$notes" ] || notes='- Improvements and fixes'
          gh release create "$tag" stencil-hrms.apk \
            --target "$GITHUB_SHA" \
            --title "Stencil HRMS ${version:-1.0.0} (build $BUILD)" \
            --notes "$notes" \
            --latest
